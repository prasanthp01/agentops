name: agentops
services:
  agentops:
    build: .
    image: agentops:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 384m
    cpus: 0.50
    ports: ["127.0.0.1:${AGENTOPS_HOST_PORT:-8785}:8785"]
    environment:
      AGENTOPS_DB: /data/agentops.db
      AGENTOPS_PUBLIC_ORIGIN: ${AGENTOPS_PUBLIC_ORIGIN:-}
      AGENTOPS_SECURE_COOKIES: ${AGENTOPS_SECURE_COOKIES:-false}
    volumes:
      - agentops_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [agentops_private, ingress]
volumes:
  agentops_data:
networks:
  agentops_private:
    internal: true
  ingress: {}
