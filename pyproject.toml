[project]
name = "agentops-local"
version = "0.1.3"
description = "Policy-first model routing, deterministic failure simulation, and usage accounting"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.12,<3", "jsonschema==4.26.0", "rfc3339-validator==0.1.4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["agentops/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
